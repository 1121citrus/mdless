name: CI

on:
  push:
    branches: [dev, main, master, staging]
    tags: ["v*"]
  pull_request:
    branches: [dev, main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

jobs:
  ci:
    uses: 1121citrus/shared-github-workflows/.github/workflows/pipeline.yml@v1
    with:
      image: 1121citrus/mdless
      test-mode: custom-sh
      test-custom-cmd: TAG="${VERSION:-test}" sh test/run-tests
      trivyignore: .trivyignore.yaml
    secrets: inherit
